<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0322">
<title>socrtwo · Projects</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
  :root{color-scheme:dark}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:radial-gradient(ellipse at top,#0f0322 0%,#08010f 70%);color:#f5f3ff;line-height:1.55;-webkit-font-smoothing:antialiased}
  .orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:f 22s ease-in-out infinite}
  .o1{width:520px;height:520px;background:#ff2e93;top:-160px;left:-130px}
  .o2{width:460px;height:460px;background:#7c3aed;bottom:-180px;right:-120px;animation-delay:-6s}
  .o3{width:380px;height:380px;background:#22d3ee;top:30%;left:55%;opacity:.3;animation-delay:-12s}
  @keyframes f{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,30px) scale(.95)}}
  main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:48px 22px 80px}
  header{margin-bottom:36px;text-align:center}
  h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#ff2e93 0%,#22d3ee 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
  .tagline{color:rgba(245,243,255,.65);font-size:1.05rem;max-width:540px;margin:0 auto}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:30px 0 28px}
  .chip{padding:9px 16px;background:rgba(20,10,40,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;cursor:pointer;font-size:.88rem;font-weight:600;color:#f5f3ff;transition:all .15s;backdrop-filter:blur(10px)}
  .chip:hover{border-color:#7c3aed}
  .chip.active{background:linear-gradient(135deg,#ff2e93,#7c3aed);border-color:transparent}
  .search{flex:1 1 240px;max-width:340px;padding:9px 16px;background:rgba(20,10,40,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;color:#f5f3ff;font:inherit;backdrop-filter:blur(10px);outline:none}
  .search:focus{border-color:#22d3ee}
  .search::placeholder{color:rgba(245,243,255,.45)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{display:flex;flex-direction:column;padding:20px 22px;background:rgba(20,10,40,.55);border:1px solid rgba(255,255,255,.1);border-radius:18px;text-decoration:none;color:inherit;backdrop-filter:blur(14px) saturate(1.4);transition:transform .2s,border-color .2s,background .2s;box-shadow:0 14px 40px rgba(0,0,0,.3)}
  .card:hover{transform:translateY(-3px);border-color:#7c3aed;background:rgba(124,58,237,.12)}
  .card-name{display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:700;margin-bottom:6px;word-break:break-word}
  .card-name .tag{font-size:.62rem;padding:2px 8px;background:linear-gradient(135deg,#ff2e93,#7c3aed);border-radius:999px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;flex-shrink:0}
  .card-name .tag.sf{background:linear-gradient(135deg,#f59e0b,#dc2626)}
  .card-desc{font-size:.88rem;color:rgba(245,243,255,.72);min-height:2.6em;margin-bottom:14px;flex:1}
  .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.74rem;color:rgba(245,243,255,.5);margin-bottom:14px}
  .meta span{display:inline-flex;align-items:center;gap:4px}
  .lang-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .actions{display:flex;gap:8px;margin-top:auto}
  .btn{flex:1;padding:8px 12px;border-radius:10px;text-align:center;text-decoration:none;font-size:.78rem;font-weight:600;color:#f5f3ff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:all .15s}
  .btn:hover{background:rgba(124,58,237,.25);border-color:#7c3aed}
  .btn.primary{background:linear-gradient(135deg,#ff2e93,#7c3aed);border-color:transparent}
  .empty,.loading{grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(245,243,255,.5);font-style:italic}
  .footer{margin-top:50px;text-align:center;color:rgba(245,243,255,.4);font-size:.82rem}
  .footer a{color:rgba(245,243,255,.7);text-decoration:none}
  .footer a:hover{color:#22d3ee}
  .stats{display:flex;justify-content:center;gap:18px;margin:18px 0 6px;font-size:.82rem;color:rgba(245,243,255,.55)}
  .stats b{color:#22d3ee;font-weight:700}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<main>
  <header>
    <h1>✨ socrtwo · Projects</h1>
    <p class="tagline">Open-source apps, tools, and SourceForge migrations. Open a project's live page where it has one, or its source.</p>
    <div class="stats" id="stats"></div>
  </header>
  <div class="toolbar">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="original">🌱 Originals</button>
    <button class="chip" data-filter="sf">📜 SourceForge migrations</button>
    <input class="search" id="search" type="search" placeholder="🔎 Search…" autocomplete="off">
  </div>
  <div class="grid" id="grid"><div class="loading">Loading repositories…</div></div>
  <p class="footer">
    Built with ☕ by <a href="https://github.com/socrtwo">@socrtwo</a> ·
    <a href="https://github.com/socrtwo?tab=repositories">All repos</a> ·
    <a id="src-link" href="#">Source for this page</a>
  </p>
</main>
<script>
const OWNER='socrtwo';
document.getElementById('src-link').href=`https://github.com/${OWNER}/${OWNER}`;
const langColors={JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',HTML:'#e34c26',CSS:'#563d7c',Java:'#b07219',Kotlin:'#A97BFF',Swift:'#F05138','C#':'#178600','C++':'#f34b7d',C:'#555555',Shell:'#89e051',Ruby:'#701516',Go:'#00ADD8',PHP:'#4F5D95'};
let allRepos=[];let activeFilter='all';let searchTerm='';
function fmtDate(s){if(!s)return'';const d=new Date(s);const days=Math.floor((Date.now()-d)/86400000);if(days<1)return'today';if(days<30)return days+'d ago';if(days<365)return Math.floor(days/30)+'mo ago';return Math.floor(days/365)+'y ago'}
function classify(r){return r.name.toLowerCase().endsWith('-sf')?'sf':'original'}
function render(){
  const grid=document.getElementById('grid');
  const filtered=allRepos.filter(r=>{
    if(activeFilter!=='all'&&classify(r)!==activeFilter)return false;
    if(searchTerm){const t=searchTerm.toLowerCase();return r.name.toLowerCase().includes(t)||(r.description||'').toLowerCase().includes(t)}
    return true;
  });
  if(!filtered.length){grid.innerHTML='<div class="empty">No matching projects</div>';return}
  grid.innerHTML=filtered.map(r=>{
    const cat=classify(r);
    const tag=cat==='sf'?'<span class="tag sf">SF</span>':'';
    const dot=r.language?`<span class="lang-dot" style="background:${langColors[r.language]||'#888'}"></span>${r.language}`:'';
    const stars=r.stargazers_count?`★ ${r.stargazers_count}`:'';
    const updated=`updated ${fmtDate(r.pushed_at)}`;
    const meta=[dot,stars,updated].filter(Boolean).map(x=>`<span>${x}</span>`).join('');
    // Only offer a live link when one exists: the repo's own homepage, or
    // its GitHub Pages site. Server-side projects have neither.
    const pageUrl=/^https?:\/\//.test(r.homepage||'')?r.homepage:(r.has_pages?`https://${OWNER}.github.io/${r.name}/`:'');
    const liveBtn=pageUrl?`<a class="btn primary" href="${encodeURI(pageUrl)}" target="_blank" rel="noopener">🌐 Live page</a>`:'';
    const desc=(r.description||'').replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
    return `<div class="card">
      <div class="card-name">${r.name} ${tag}</div>
      <p class="card-desc">${desc||'<em style="opacity:.5">No description</em>'}</p>
      <div class="meta">${meta}</div>
      <div class="actions">
        ${liveBtn}
        <a class="btn${liveBtn?'':' primary'}" href="${r.html_url}" target="_blank" rel="noopener">Source</a>
      </div>
    </div>`;
  }).join('');
}
function updateStats(){
  const total=allRepos.length;
  const sf=allRepos.filter(r=>classify(r)==='sf').length;
  const orig=total-sf;
  document.getElementById('stats').innerHTML=`<span><b>${total}</b> projects</span><span><b>${orig}</b> original</span><span><b>${sf}</b> SourceForge migrations</span>`;
}
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  activeFilter=c.dataset.filter;render();
}));
document.getElementById('search').addEventListener('input',e=>{searchTerm=e.target.value.trim();render()});
(async()=>{
  try{
    let page=1;let acc=[];
    while(true){
      const r=await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&type=owner&sort=pushed&page=${page}`);
      if(!r.ok)break;
      const data=await r.json();
      if(!Array.isArray(data)||!data.length)break;
      acc=acc.concat(data);
      if(data.length<100)break;
      page++;
    }
    allRepos=acc.filter(r=>!r.archived&&!r.fork&&!r.private&&r.name!==OWNER);
    updateStats();render();
  }catch(e){
    document.getElementById('grid').innerHTML='<div class="empty">Failed to load repositories. Try refreshing.</div>';
  }
})();
</script>
</body>
</html>
